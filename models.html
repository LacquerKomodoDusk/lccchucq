<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Персонажи — просмотр моделей</title>
  <link href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #15121a; --panel: #1f1a24; --ink: #e8e2cf; --dim: #8c8a7c; --accent: #b3382c; --line: #3a3340; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'PT Mono', monospace; }
    #app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
    #view { position: relative; min-width: 0; }
    #view canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #stats { position: absolute; left: 12px; top: 10px; font-size: 13px; color: var(--dim); line-height: 1.5; }
    aside { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 15px; margin: 0; letter-spacing: 1px; }
    h2 { font-size: 12px; margin: 0 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button, select { font: inherit; font-size: 13px; background: #2a2430; color: var(--ink); border: 1px solid var(--line); padding: 6px 9px; cursor: pointer; }
    button.on { border-color: var(--accent); background: #3a2226; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); }
    .tex { position: relative; width: 100%; aspect-ratio: 1; background: #000; }
    .tex img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .note { font-size: 12px; color: var(--dim); line-height: 1.5; }
    label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
    @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="view"><div id="stats"></div></div>
    <aside>
      <h1>Персонажи · модели</h1>
      <section>
        <h2>Персонаж</h2>
        <div class="row" id="chars"></div>
      </section>
      <section>
        <h2>Анимация</h2>
        <div class="row"><select id="anim" aria-label="Анимация"></select><button id="play">Пауза</button></div>
      </section>
      <section>
        <h2>Отображение</h2>
        <div class="row">
          <button id="wire">Каркас</button>
          <button id="bones">Скелет</button>
          <button id="spin">Вращение</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button data-view="front">Спереди</button><button data-view="side">Сбоку</button><button data-view="back">Сзади</button>
        </div>
      </section>
      <section>
        <h2>Лицо (вариант атласа)</h2>
        <div class="row"><select id="face" aria-label="Вариант лица"></select></div>
      </section>
      <section>
        <h2>Текстура 256×256</h2>
        <label><input type="checkbox" id="showuv" checked /> UV-развёртка поверх</label>
        <div class="tex"><img id="atlas" alt="Текстурный атлас" /><img id="uv" alt="UV-развёртка" /></div>
      </section>
      <p class="note">Мышь: вращать — левая кнопка, приблизить — колесо, сдвиг — правая кнопка.</p>
    </aside>
  </div>
  <script type="module" src="./src/modelviewer.js"></script>
</body>
</html>
